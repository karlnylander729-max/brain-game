// Top plus bottom safe-area insets in CSS px (0 outside a standalone notched iPhone).
function safeInsetsPx() {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;padding-top:env(safe-area-inset-top);padding-bottom:var(--bottom)';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe), px = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  probe.remove();
  return px;
}

function renderDeepRotation(item, el) {
  el.innerHTML = '';
  el.className = 'deepRot';
  const q = document.createElement('div'); q.className = 'q'; q.textContent = 'Which one is the target, turned?';
  const fig = document.createElement('div'); fig.className = 'fig';
  const ts = Math.round(screenWidth() * 0.4);
  const t = makeFigureCanvas(ts, ts);
  drawPolycube(t, item.target.vox, item.target.pose, true);
  fig.appendChild(t);
  const grid = document.createElement('div'); grid.className = 'grid4';
  const room = ((window.innerHeight || 667) - 44 - 60 - 45 - ts - 12 - 32 - safeInsetsPx()) / 2;
  const size = Math.floor(Math.min((screenWidth() - 36) / 2 - 4, room));
  item.candidates.forEach((cand, i) => grid.appendChild(makeCandidateTile(cand, i, size)));
  el.append(q, fig, grid);
}

function makeLabel(text) {
  const d = document.createElement('div'); d.className = 'lbl'; d.textContent = text;
  return d;
}

function makeSquare(item, sq, phase) {
  const name = squareName(sq);
  const el = phase === 'answer' ? makeAnswerButton('', name, 'sq') : document.createElement('div');
  el.className = 'sq' + ((sq[0] + sq[1]) % 2 ? '' : ' dk');
  if (phase === 'start' && sq[0] === item.start[0] && sq[1] === item.start[1]) el.textContent = item.piece || '●';
  return el;
}

function makeBoard(item, phase) {
  const n = item.size, board = document.createElement('div');
  board.className = 'board';
  board.style.setProperty('--n', n);
  board.style.setProperty('--cell', Math.floor(Math.min(screenWidth() - 64, 330) / n) + 'px');
  board.style.gridTemplateColumns = 'auto repeat(' + n + ', var(--cell))';
  for (let r = n - 1; r >= 0; r--) {
    board.appendChild(makeLabel(String(r + 1)));
    for (let f = 0; f < n; f++) board.appendChild(makeSquare(item, [f, r], phase));
  }
  board.appendChild(makeLabel(''));
  for (let f = 0; f < n; f++) board.appendChild(makeLabel('abcde'[f]));
  return board;
}

function makeMoveIcon(move) {
  const { start, end } = iconCells(move), icon = document.createElement('div');
  icon.className = 'icon';
  for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
    const c = document.createElement('i');
    if (col === start[0] && row === start[1]) c.className = 's';
    if (col === end[0] && row === end[1]) c.className = 'e';
    icon.appendChild(c);
  }
  return icon;
}

// Light shows one move per step; the icon hides 80 % into the step so repeated moves read as two flashes.
function flashedIcon(item, index) {
  const icon = makeMoveIcon(item.moves[index]);
  setTimer(() => { icon.style.visibility = 'hidden'; }, item.flashMs * .8);
  return icon;
}

const TRACKING_QUESTION = { start: 'Start here', moves: 'Follow the moves', answer: 'Where did it end?' };

function renderTracking(item, el, phase, index) {
  el.innerHTML = '';
  el.className = item.kind;
  const q = document.createElement('div'); q.className = 'q'; q.textContent = TRACKING_QUESTION[phase];
  if (phase === 'start' || item.kind === 'trkD') q.textContent += ' · ' + (item.piece || '●') + ' ' + squareName(item.start);
  const icons = document.createElement('div'); icons.className = 'icons';
  if (phase !== 'start' && item.kind === 'trkD') item.moves.forEach(m => icons.appendChild(makeMoveIcon(m)));
  if (phase === 'moves') icons.appendChild(flashedIcon(item, index));
  if (item.kind === 'trkD') el.append(q, icons, makeBoard(item, phase));
  else el.append(q, makeBoard(item, phase), icons);
}

function markTrackingMiss(el, item) {
  const n = item.size, cell = el.querySelector('.sq').offsetWidth;
  el.querySelector('[data-answer="' + squareName(item.end) + '"]').classList.add('right');
  let [f, r] = item.start;
  const pts = [[f, r], ...item.moves.map(([df, dr]) => [f += df, r += dr])];
  const xy = ([a, b]) => (a + .5) + ',' + (n - b - .5);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'path'); svg.setAttribute('viewBox', '0 0 ' + n + ' ' + n);
  svg.setAttribute('width', cell * n); svg.setAttribute('height', cell * n);
  svg.innerHTML = '<polyline pathLength="1" fill="none" stroke="#e09b2d" stroke-width=".09" stroke-linejoin="round" points="' + pts.map(xy).join(' ') + '"/>';
  el.querySelector('.board').appendChild(svg);
}

// ----- Light feed -----
const app = { state: null, storage: window.localStorage, mode: 'L', item: null, phase: null, startedAt: 0, locked: true, timers: [], missAt: 0 };

function setTimer(fn, ms) { app.timers.push(setTimeout(fn, ms)); }
function clearTimers() { app.timers.forEach(clearTimeout); app.timers = []; }

function correctAnswer(item) {
  return DRILLS[drillOf(item)].answer(item);
}

// Correct Light answers since local midnight, then the median time of the last 10 Light answers.
function lightCornerText() {
  const light = app.state.history.filter(h => h[2] === 'L'), midnight = new Date().setHours(0, 0, 0, 0);
  const today = light.filter(h => h[4] === 1 && h[0] >= midnight).length, ms = light.slice(-10).map(h => h[5]);
  return 'today ' + today + ' · ' + (ms.length ? (median(ms) / 1000).toFixed(1) + ' s' : '– s');
}

function updateCorner() { document.getElementById('lightCorner').textContent = lightCornerText(); }

function makeItemRng() { return makeRng((Math.random() * 2 ** 32) >>> 0); }

function becomeAnswerable(item, el) {
  app.phase = 'answer'; app.locked = false; app.startedAt = performance.now();
  DRILLS[drillOf(item)].render(item, el, 'answer');
}

// The first step renders at once, so an empty timeline makes the item answerable immediately.
function runSteps(item, el, steps) {
  if (!steps.length) return becomeAnswerable(item, el);
  const [step, ...rest] = steps;
  app.phase = step.phase;
  DRILLS[drillOf(item)].render(item, el, step.phase, step.index);
  setTimer(() => runSteps(item, el, rest), step.ms);
}

function playItem(item, el) {
  const id = drillOf(item);
  app.locked = true;
  runSteps(item, el, DRILLS[id].timeline(item, app.mode, itemLevel(app.state, id, app.mode)));
}

function nextLightItem() {
  clearTimers();
  document.getElementById('lightFlash').className = '';
  updateCorner();
  const id = pickLightDrill();
  app.item = DRILLS[id].light(itemLevel(app.state, id, 'L'), makeItemRng());
  playItem(app.item, document.getElementById('lightItem'));
}

function startLight() {
  app.mode = 'L';
  showScreen('light');
  guarded(nextLightItem);
}

function exitLight() {
  app.item = null; app.phase = null; app.locked = true;
  document.getElementById('lightFlash').className = '';
  showStart();
}

// Drills without markMiss get the right answer button outlined, when the answer is one button.
function markRight(el, item) {
  const def = DRILLS[drillOf(item)];
  if (def.markMiss) return def.markMiss(el, item);
  const btn = el.querySelector('[data-answer="' + def.answer(item) + '"]');
  if (btn) btn.classList.add('right');
}

// Deep Take-away and Reach keep their question: it states the takes / moves the reason refers to.
const DEEP_KEEP_QUESTION = ['nim', 'rch'];

// Light: the reason goes under the item, just above the answer area (the item's last block).
// Deep: it replaces the question text, so the item's height does not grow; DEEP_KEEP_QUESTION drills add it under the question.
function showReason(el, item) {
  const def = DRILLS[drillOf(item)];
  if (!def.explain) return;
  if (app.mode === 'D') {
    let q = el.querySelector('.q');
    if (DEEP_KEEP_QUESTION.includes(drillOf(item))) { q.after(makeDiv('q', '')); q = q.nextSibling; }
    q.textContent = def.explain(item); q.classList.add('why');
    return;
  }
  const why = makeDiv('why', '');
  why.textContent = def.explain(item);
  el.lastElementChild.before(why);
}

function showFeedback(correct) {
  document.getElementById('lightFlash').className = correct ? 'ok' : 'miss';
  if (correct) return;
  const el = document.getElementById('lightItem');
  markRight(el, app.item);
  showReason(el, app.item);
}

// After a Light miss the next item comes on a tap anywhere (taps in the first 300 ms are ignored) or at 3 s.
const MISS_WAIT_MS = 3000;

function waitAfterMiss() {
  app.phase = 'miss'; app.missAt = performance.now();
  setTimer(() => guarded(nextLightItem), MISS_WAIT_MS);
}

// A tap during the miss wait only advances; it never answers the next item.
function lightTap(target) {
  if (app.phase === 'miss') {
    if (performance.now() - app.missAt >= TAP_GUARD_MS) guarded(nextLightItem);
    return;
  }
  const btn = target.closest('[data-answer]');
  if (btn) answer(btn.dataset.answer);
}

// A tap within TAP_GUARD_MS of an item becoming answerable (startedAt) is ignored: it was meant for the screen before.
const TAP_GUARD_MS = 300;

function answer(choice) {
  if (app.locked || app.phase !== 'answer') return;
  if (performance.now() - app.startedAt < TAP_GUARD_MS) return;
  app.locked = true;
  const correct = choice === correctAnswer(app.item), drill = drillOf(app.item);
  const ms = Math.round(performance.now() - app.startedAt);
  recordAnswer(app.state, { drill, mode: app.mode, level: itemLevel(app.state, drill, app.mode), correct, ms, t: Date.now() });
  saveState(app.state, app.storage);
  updateCorner();
  if (app.mode === 'D') return showDeepFeedback(correct, ms);
  showFeedback(correct);
  if (correct) setTimer(() => guarded(nextLightItem), 250);
  else waitAfterMiss();
}

// ----- Deep sets -----
function deepEl() { return document.getElementById('deepItem'); }

function showDeepFeedback(correct, ms) {
  app.deepSet.results.push({ correct, ms });
  document.getElementById('deepStatus').textContent = (correct ? '✓ ' : '✗ ') + (ms / 1000).toFixed(1) + ' s';
  markRight(deepEl(), app.item);
  if (!correct) showReason(deepEl(), app.item);
  document.getElementById('deepNext').hidden = false;
}

function showDeepSummary() {
  const rows = app.deepSet.results.map((r, i) =>
    '<div class="row"><span>Puzzle ' + (i + 1) + '</span><span>' + (r.ms / 1000).toFixed(1) + ' s</span><span class="' + (r.correct ? 'ok">right' : 'miss">wrong') + '</span></div>').join('');
  app.item = null; app.locked = true;
  document.getElementById('deepCount').textContent = '';
  document.getElementById('deepStatus').textContent = '';
  const el = deepEl();
  el.className = '';
  el.innerHTML = '<div class="summary"><h2>Set done</h2>' + rows + '</div>';
  const done = document.createElement('button');
  done.id = 'deepDone'; done.textContent = 'Done';
  done.addEventListener('click', exitDeep);
  el.querySelector('.summary').appendChild(done);
}

function nextDeepItem() {
  clearTimers();
  const set = app.deepSet;
  document.getElementById('deepNext').hidden = true;
  document.getElementById('deepStatus').textContent = '';
  if (set.results.length >= CONFIG.deepSetSize) return showDeepSummary();
  playDeepScene(pickDeepScene(set.skill, set.drill, makeItemRng()));
}

// set.drill is the scene now playing, so the next pick can avoid it.
function playDeepScene(drill) {
  const set = app.deepSet;
  set.drill = drill;
  document.getElementById('deepCount').textContent = 'puzzle ' + (set.results.length + 1) + ' / ' + CONFIG.deepSetSize;
  app.item = DRILLS[drill].deep(itemLevel(app.state, drill, 'D'), makeItemRng());
  playItem(app.item, deepEl());
}

function startDeep(skill) {
  app.mode = 'D';
  app.deepSet = { skill, drill: null, results: [] };
  showScreen('deep');
  guarded(nextDeepItem);
}

// Ruling W: ✕ and Done go back to the skill menu, one tap from the next set.
function exitDeep() {
  app.item = null; app.locked = true; app.deepSet = null;
  showDeepSkills();
}

// Leaving the app drops the item unrecorded, so time away never counts as an answer.
function dropToStart() {
  app.item = null; app.phase = null; app.locked = true; app.deepSet = null;
  document.getElementById('lightFlash').className = '';
  showStart();
}

// An item generator that throws gets one fresh try, then the player lands on the start screen.
function guarded(next) {
  try { next(); } catch (e) {
    console.error(e);
    try { next(); } catch (e2) { console.error(e2); dropToStart(); }
  }
}

function menuButton(label, key, value) {
  const b = document.createElement('button');
  b.textContent = label; b.dataset[key] = value;
  return b;
}

// A skill opens once it has at least one visible scene; hidden skills are left out.
function showDeepSkills() {
  const menu = document.getElementById('skillMenu');
  menu.innerHTML = '';
  for (const k of SKILLS.filter(k => !skillHidden(k.id))) {
    const b = menuButton(k.name, 'skill', k.id);
    b.disabled = !scenesOf(k.id).length;
    menu.appendChild(b);
  }
  showScreen('deepPick');
}

function wireDeep() {
  document.getElementById('goDeep').addEventListener('click', showDeepSkills);
  document.getElementById('pickExit').addEventListener('click', showStart);
  document.getElementById('deepExit').addEventListener('click', exitDeep);
  document.getElementById('deepNext').addEventListener('click', () => guarded(nextDeepItem));
  document.getElementById('deepPick').addEventListener('click', e => {
    const btn = e.target.closest('[data-skill]');
    if (btn) startDeep(btn.dataset.skill);
  });
  document.getElementById('deep').addEventListener('click', e => {
    const btn = e.target.closest('[data-answer]');
    if (btn) answer(btn.dataset.answer);
  });
}

function wireStart() {
  const box = document.getElementById('progress');
  document.getElementById('start').addEventListener('click', () => { box.hidden = true; }, true);
  document.addEventListener('visibilitychange', () => { if (document.hidden) dropToStart(); });
}

function showStart() {
  const line = progressLine(app.state, Date.now()), box = document.getElementById('progress');
  box.textContent = line || '';
  box.hidden = !line;
  showScreen('start');
}

function wireLight() {
  document.getElementById('goLight').addEventListener('click', startLight);
  document.getElementById('lightExit').addEventListener('click', exitLight);
  document.getElementById('light').addEventListener('click', e => lightTap(e.target));
}

function showScreen(id) {
  clearTimers();
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === id));
}

function init() {
  app.state = loadState(app.storage);
  wireLight();
  wireDeep();
  wireStart();
  showStart();
}

function det3(m) {

       + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
}

const IDENTITY3 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
const FACE_RGB = { U: [220, 30, 30], D: [30, 200, 30], F: [30, 30, 220], B: [220, 200, 30], L: [30, 200, 200], R: [200, 30, 200] };
function paintSolid(g, id) { g.fillStyle = 'rgb(' + FACE_RGB[id] + ')'; g.fillRect(0, 0, 1, 1); }
// A pixel "is" face id's colour when each channel matches up to the renderer's light shading.
function rgbMatches(d, k, id) {
  const c = FACE_RGB[id], s = d[k] / c[0];
  return d[k + 3] === 255 && s > 0.5 && [1, 2].every(j => Math.abs(d[k + j] - c[j] * s) < 12);
}
test('faced cube: CUBE_FACES are unit, orthogonal and right-handed', () => {
  assert(CUBE_FACES.length === 6 && new Set(CUBE_FACES.map(f => f.id)).size === 6, 'six ids');
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  CUBE_FACES.forEach(({ id, n, u, v }) => {
    assert(dot(n, n) === 1 && dot(u, u) === 1 && dot(v, v) === 1 && !dot(n, u) && !dot(n, v) && !dot(u, v), 'orthonormal ' + id);
    assert(det3([u, v, n]) === 1, 'right-handed ' + id);
  });
});

  drawFacedCube(c, IDENTITY3, paintSolid, { dark: false });
  const d = c.getContext('2d').getImageData(0, 0, W, W).data, vis = visibleFaces(IDENTITY3);
  for (const id of Object.keys(FACE_RGB)) {
    let n = 0;
    for (let k = 0; k < d.length; k += 4) if (rgbMatches(d, k, id)) n++;
    assert(vis.includes(id) ? n > 600 : n === 0, id + ' pixels ' + n);

test('faced cube: a mark at a face\'s (0.2, 0.2) lands on its projected corner', () => {
  const W = 200, c = document.createElement('canvas'); c.width = c.height = W;
  const m = ROTATIONS[5], id = visibleFaces(m)[0], f = CUBE_FACES.find(x => x.id === id), sc = fitScale([[0, 0, 0]], c);
  drawFacedCube(c, m, (g, fid) => { if (fid === id) { g.fillStyle = 'rgb(' + FACE_RGB.U + ')'; g.fillRect(0.15, 0.15, 0.1, 0.1); } }, { dark: false });
  const d = c.getContext('2d').getImageData(0, 0, W, W).data;
  // Independent oracle: paint (s, t) is the 3D point n/2 + (s - 0.5) u + (0.5 - t) v, then orient, then the view pose.
  const pixel = (s, t) => {
    const p = [0, 1, 2].map(i => f.n[i] / 2 + (s - 0.5) * f.u[i] + (0.5 - t) * f.v[i]);
    const q = applyPose(m.map(r => r[0] * p[0] + r[1] * p[1] + r[2] * p[2]), CUBE_VIEW);
    return (Math.round(W / 2 - q[1] * sc) * W + Math.round(W / 2 + q[0] * sc)) * 4;
  };
  assert(rgbMatches(d, pixel(0.2, 0.2), 'U'), 'mark at (0.2, 0.2)');
  assert(!rgbMatches(d, pixel(0.8, 0.8), 'U') && !rgbMatches(d, pixel(0.8, 0.2), 'U'), 'not at other corners');
});
test('faced cube: subdiv 3 draws grid lines inside a face', () => {

  const a = plain(); c.width = W; drawFacedCube(c, IDENTITY3, paintSolid, { dark: true, subdiv: 3 });

});

// Oracle: reads only the shown terms. Each attribute's step is the common difference of consecutive terms.
function dialNext(terms) {
  const next = {};
  DIAL_ATTRS.forEach(a => {
    const m = DIAL_MODS[a], v = terms.map(t => t[a]), step = (v[1] - v[0] + m) % m;
    v.slice(1).forEach((x, i) => assert((x - v[i] + m) % m === step, 'constant step ' + a));
    next[a] = (v[v.length - 1] + step) % m;
  });
  return next;
}

function deepPositionCounts(make, eventsOf, n) {
  const rng = makeRng(2026), card = [0, 0, 0, 0], ans = [0, 0, 0, 0];
  const isCard = e => eventCatalog().cards.some(c => c.text === e.text);
  for (let i = 0; i < n; i++) {
    const it = make(6, rng), evs = eventsOf(it);
    evs.forEach((e, k) => { if (isCard(e)) card[k]++; });
    ans[+it.answer]++;
  }
  return { card, ans };
}

      for (let target = start; target <= 60; target++) {
        const path = shortestPath(start, target, moves);
        if (path) assert(path.length - 1 === brute(start, target, moves), 'minSteps ' + moves + ' ' + start + '->' + target);
        else assert(brute(start, target, moves) === -1, 'unreachable ' + moves + ' ' + start + '->' + target);

  });

// Red means a hue within 25 degrees of pure red with real saturation.
function isReddish(css) {
  const [r, g, b] = css.match(/[\d.]+/g).map(Number), max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max === 0 || (max - min) / max < 0.25) return false;
  let h = max === r ? (g - b) / (max - min) : max === g ? 2 + (b - r) / (max - min) : 4 + (r - g) / (max - min);
  h = (h * 60 + 360) % 360;
  return h < 25 || h > 335;
}

// ===== DIE TESTS =====
// Oracle: six face numbers kept by world position, moved by cycles of positions (no matrices).
const DIE_CYCLES = {
  rollF: [['U', 'F', 'D', 'B']], rollB: [['U', 'B', 'D', 'F']],
  rollR: [['U', 'R', 'D', 'L']], rollL: [['U', 'L', 'D', 'R']],
  spinCW: [['F', 'L', 'B', 'R']], spinCCW: [['F', 'R', 'B', 'L']]
};
function oracleDieTop(start, moves) {
  let at = {};
  CUBE_FACES.forEach(w => {
    const body = CUBE_FACES.find(b => dieDir(start, b.n).join() === w.n.join());
    at[w.id] = DIE_NUMBERS[body.id];
  });
  for (const mv of moves) {
    const next = { ...at };
    DIE_CYCLES[mv].forEach(c => c.forEach((pos, i) => { next[c[(i + 1) % 4]] = at[pos]; }));
    at = next;
  }
  return at.U;
}
function dieDir(m, v) { return applyMat(m, v); }
function allDieSequences(maxLen) {
  let out = [[]], layer = [[]];
  for (let n = 1; n <= maxLen; n++) {
    layer = layer.flatMap(s => DIE_MOVE_IDS.map(m => [...s, m]));
    out = out.concat(layer);
  }
  return out.slice(1);
}

// ===== NET TESTS =====
// Oracle: roll a cube behind the paper across the net cells (cycles of world labels, no frames or matrices).
// The face pressed against the paper is the world +z side 'F'; viewer at +z, x right, y up the screen.
const NET_ROLL = {
  E: { R: 'F', F: 'L', L: 'B', B: 'R' }, W: { L: 'F', F: 'R', R: 'B', B: 'L' },
  N: { U: 'F', F: 'D', D: 'B', B: 'U' }, S: { D: 'F', F: 'U', U: 'B', B: 'D' }
};
const NET_STEP = { E: [0, 1, 'W'], W: [0, -1, 'E'], N: [-1, 0, 'S'], S: [1, 0, 'N'] };
const LABEL_VEC = { U: [0, 1, 0], D: [0, -1, 0], F: [0, 0, 1], B: [0, 0, -1], R: [1, 0, 0], L: [-1, 0, 0] };
function rollCube(at, dir) {
  const p = NET_ROLL[dir], mv = l => p[l] || l, next = {};
  Object.keys(at).forEach(l => { next[mv(l)] = { ...at[l], up: mv(at[l].up) }; });
  return next;
}
// Returns world label -> { g, up label } after stamping every cell; throws if a face is stamped twice.
function oracleFold(cells, glyphs) {
  let at = {}; const seen = new Set();
  Object.keys(LABEL_VEC).forEach(l => { at[l] = { cell: -1, up: 'U' }; });
  const visit = i => {
    seen.add(i);
    assert(at.F.cell === -1, 'face stamped twice');
    at.F = { cell: i, g: glyphs[i].g, up: ['U', 'R', 'D', 'L'][glyphs[i].r] };
    Object.keys(NET_STEP).forEach(d => {
      const [dr, dc, back] = NET_STEP[d], j = cells.findIndex(c => c[0] === cells[i][0] + dr && c[1] === cells[i][1] + dc);
      if (j < 0 || seen.has(j)) return;
      at = rollCube(at, d); visit(j); at = rollCube(at, back);
    });
  };
  visit(0);
  assert(seen.size === 6 && Object.values(at).every(x => x.cell >= 0), 'net covers six faces');
  return at;
}
function oracleOpposite(at, g) {
  const l = Object.keys(at).find(k => at[k].g === g), v = LABEL_VEC[l];
  return at[Object.keys(LABEL_VEC).find(k => LABEL_VEC[k].every((x, i) => x === -v[i]))].g;
}
// What a cube option shows, read through the renderer contract: visible face normals, glyph, glyph-up direction.
function shownFaces(opt) {
  return visibleFaces(opt.orient).map(id => {
    const f = CUBE_FACES.find(x => x.id === id), r = opt.faces[id].r, neg = a => a.map(x => -x);
    const up = [f.v, f.u, neg(f.v), neg(f.u)][r];
    return { n: applyMat(opt.orient, f.n), g: opt.faces[id].g, up: applyMat(opt.orient, up) };
  });
}
function oracleConsistent(at, opt) {
  const shown = shownFaces(opt), key = (v, q) => applyMat(q, v).join();
  return ROTATIONS.some(q => shown.every(s => {
    const l = Object.keys(LABEL_VEC).find(k => key(LABEL_VEC[k], q) === s.n.join());
    return at[l].g === s.g && key(LABEL_VEC[at[l].up], q) === s.up.join();
  }));
}
function netPicture(opt) { return shownFaces(opt).map(s => s.n + ':' + s.g + ':' + s.up).sort().join('|'); }

test('net: eleven distinct nets, each folds to six faces by rolling', () => {
  assert(NETS.length === 11, 'count');
  const canon = cells => {
    const forms = [];
    for (let k = 0; k < 8; k++) {
      let p = cells.map(([r, c]) => (k & 1 ? [c, r] : [r, c])).map(([r, c]) => [k & 2 ? -r : r, k & 4 ? -c : c]);
      const mr = Math.min(...p.map(x => x[0])), mc = Math.min(...p.map(x => x[1]));
      forms.push(p.map(([r, c]) => [r - mr, c - mc].join()).sort().join(';'));
    }
    return forms.sort()[0];

// Oracle: right-hand rule by Rodrigues' formula, applied turn by turn to the start voxels (no generator matrices).
function oracleTurn(vox, t) {
  const k = [0, 1, 2].map(i => (i === t.axis ? 1 : 0)), c = Math.round(Math.cos(t.deg * DEG)), s = Math.round(Math.sin(t.deg * DEG));
  return vox.map(v => {
    const kx = [k[1] * v[2] - k[2] * v[1], k[2] * v[0] - k[0] * v[2], k[0] * v[1] - k[1] * v[0]], kv = k[0] * v[0] + k[1] * v[1] + k[2] * v[2];
    return [0, 1, 2].map(i => v[i] * c + kx[i] * s + k[i] * kv * (1 - c));
  });
}
function oracleResult(item) { return item.turns.reduce(oracleTurn, item.shape); }
function rtiOverlap(a, b) {
  const A = new Set(normalize(a).map(v => v.join())); return normalize(b).filter(v => A.has(v.join())).length;
}

// ===== CHESS TESTS =====
// Independent validator: replays the moves from the start squares with plain geometry (no generator helpers).
function chessMoveLegal(type, { from, to, other }, size) {
  const df = to[0] - from[0], dr = to[1] - from[1], ax = Math.abs(df), ay = Math.abs(dr);
  if (to[0] < 0 || to[1] < 0 || to[0] >= size || to[1] >= size || (!ax && !ay)) return false;
  if (other && other[0] === to[0] && other[1] === to[1]) return false;
  if (type === 'knight') return ax * ay === 2;
  const line = { rook: !ax || !ay, bishop: ax === ay, queen: !ax || !ay || ax === ay, king: ax <= 1 && ay <= 1 }[type];
  if (!line) return false;
  const steps = Math.max(ax, ay);
  for (let k = 1; k < steps; k++) {
    const f = from[0] + Math.sign(df) * k, r = from[1] + Math.sign(dr) * k;
    if (other && other[0] === f && other[1] === r) return false;
  }
  return true;
}
function chessReplay(item) {
  const pos = item.starts.map(s => s.slice());
  item.moves.forEach((m, i) => {
    assert(m.p === i % item.types.length, 'pieces alternate');
    assert(m.from.join() === pos[m.p].join(), 'move starts where the piece is');
    assert(chessMoveLegal(item.types[m.p], { from: m.from, to: m.to, other: item.types.length > 1 ? pos[1 - m.p] : null }, item.size), 'legal ' + item.types[m.p] + ' ' + m.from + '>' + m.to);
    pos[m.p] = m.to;
  });
  return pos[item.ask];
}

// Draws the glyph on a canvas in the board's own font and returns the height of the visible ink in px.
function glyphInkHeight(glyph, font) {
  const px = parseFloat(font.fontSize), c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = c.height = Math.ceil(px * 2);
  x.font = px + 'px ' + font.fontFamily; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(glyph + '\uFE0E', px, px);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let top = c.height, bottom = -1;
  for (let i = 3; i < d.length; i += 4) {
    if (d[i] > 100) { const y = Math.floor(i / 4 / c.width); top = Math.min(top, y); bottom = Math.max(bottom, y); }
  }
  return bottom - top + 1;
}

// ===== CUBE TESTS =====
// Hand-coded cycles (clockwise seen from outside the face): U carries the top rows F→L→B→R, R carries the right columns F→U→B→D.
const CUB_HAND = {
  U: [['F0', 'L0', 'B0', 'R0'], ['F1', 'L1', 'B1', 'R1'], ['F2', 'L2', 'B2', 'R2'], ['U0', 'U2', 'U8', 'U6'], ['U1', 'U5', 'U7', 'U3']],
  R: [['F2', 'U2', 'B6', 'D2'], ['F5', 'U5', 'B3', 'D5'], ['F8', 'U8', 'B0', 'D8'], ['R0', 'R2', 'R8', 'R6'], ['R1', 'R5', 'R7', 'R3']]
};
const cubIdx = id => STICKERS.findIndex(s => s.id === id);
const cubCompose = (p, q) => p.map(j => q[j]); // p first, then q
const cubIsId = p => p.every((j, i) => j === i);

test('cube: 54 stickers; U and R quarter turns match the hand-coded cycles', () => {
  assert(STICKERS.length === 54 && new Set(STICKERS.map(s => s.id)).size === 54, 'stickers');
  for (const face of ['U', 'R']) {
    const perm = turnPerm(face, 1), moved = new Set();
    CUB_HAND[face].forEach(cyc => cyc.forEach((id, k) => {
      assert(STICKERS[perm[cubIdx(id)]].id === cyc[(k + 1) % 4], face + ': ' + id + ' -> ' + STICKERS[perm[cubIdx(id)]].id);
      moved.add(id);
    }));
    assert(perm.every((j, i) => moved.has(STICKERS[i].id) || j === i), face + ': the rest stays');
  }
});
test('cube: four quarter turns are the identity, a turn then its inverse too, half = two quarters', () => {
  for (const face of ['U', 'D', 'F', 'B', 'L', 'R']) {
    const cw = turnPerm(face, 1), ccw = turnPerm(face, -1), half = turnPerm(face, 2);
    assert(new Set(cw).size === 54 && cw.some((j, i) => j !== i), face + ' bijection that moves');
    assert(cubIsId([cw, cw, cw].reduce(cubCompose, cw)) && cubIsId([ccw, ccw, ccw].reduce(cubCompose, ccw)), face + ' 4x');
    assert(cubIsId(cubCompose(cw, ccw)) && cubIsId(cubCompose(half, half)), face + ' inverse');
    assert(cubCompose(cw, cw).join() === half.join() && cubCompose(ccw, ccw).join() === half.join(), face + ' half');
  }
});
// Independent oracle: rotate the sticker's centre point with float trigonometry (Rodrigues), no permutation tables.
function cubOracle(item) {
  let s = STICKERS[item.marked], p = s.cubie.map((x, i) => x + s.n[i] / 2);
  for (const t of item.turns) {
    const a = CUBE_FACES.find(f => f.id === t.face).n;
    if (p.reduce((acc, x, i) => acc + x * a[i], 0) < 0.9) continue;

// ===== LINEAR MAP TESTS =====
// Oracles: shape points mapped by explicit sums, determinants by cofactor formulas, singular values by sampling directions.
function oracleDet(M) {
  return M.length === 2 ? M[0][0] * M[1][1] - M[0][1] * M[1][0] : det3(M);
}
function oracleMap(M, p) {
  const out = [];
  for (let i = 0; i < M.length; i++) { let s = 0; for (let k = 0; k < p.length; k++) s += M[i][k] * p[k]; out.push(s); }
  return out;
}
function oraclePoints(n) {
  if (n === 2) return [[0, 0], [1, 0], [1, 0.4], [0.4, 0.4], [0.4, 1.6], [0, 1.6]];
  const pts = [];
  L_SHAPE_3D.forEach(v => [0, 1].forEach(a => [0, 1].forEach(b => [0, 1].forEach(c => pts.push([(v[0] + a) / 2, (v[1] + b) / 2, (v[2] + c) / 2])))));

}
function oraclePicture(M) {
  return [...new Set(oraclePoints(M.length).map(p => oracleMap(M, p).map(x => x.toFixed(3)).join()))].sort().join(';');
}
// Smallest |Mv| over many unit directions (a circle for 2×2, a Fibonacci sphere for 3×3).
function oracleStretches(M) {
  const dirs = M.length === 2 ? Array.from({ length: 720 }, (_, i) => [Math.cos(i * Math.PI / 720), Math.sin(i * Math.PI / 720)])

}
const oracleMinStretch = M => Math.min(...oracleStretches(M));
// Every one-mistake edit of M: transpose, two columns swapped, one sign flipped, one entry ±1.
function oracleEdits(M) {
  const n = M.length, out = [M[0].map((_, j) => M.map(r => r[j]))];
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) out.push(M.map(r => r.map((x, j) => r[j === a ? b : j === b ? a : j])));
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) [-2 * M[i][j], 1, -1].forEach(d => out.push(M.map((r, a) => r.map((x, b) => (a === i && b === j ? x + d : x)))));
  return out.map(matKey);
}

// Option-only shortcuts: the option nearest the others (entries or picture), the per-entry majority,
// the largest Σ|entries| and the |det| nearest 1 (the two largest measured leaks).
function mfwShortcutRates(items) {
  const l1 = (a, b) => a.flat().reduce((s, x, k) => s + Math.abs(x - b.flat()[k]), 0);
  const pic = M => oraclePoints(M.length).map(p => oracleMap(M, p)).flat();
  const l2 = (a, b) => { const pa = pic(a), pb = pic(b); return Math.hypot(...pa.map((x, k) => x - pb[k])); };
  const vote = ms => ms.map(m => m.flat().reduce((s, x, k) => s + ms.filter(o => o.flat()[k] === x).length, 0));
  const near = d => ms => ms.map(a => -ms.reduce((s, b) => s + d(a, b), 0));
  const sumAbs = ms => ms.map(m => m.flat().reduce((s, x) => s + Math.abs(x), 0)), detNearOne = ms => ms.map(m => -Math.abs(Math.abs(oracleDet(m)) - 1));
  return [near(l1), near(l2), vote, sumAbs, detNearOne].map(score => items.reduce((hit, it) => {
    const s = score(it.mats), top = Math.max(...s.map(x => +x.toFixed(6))), best = s.map((x, j) => (+x.toFixed(6) === top ? j : -1)).filter(j => j >= 0);
    return hit + (best.includes(+it.answer) ? 1 / best.length : 0);
  }, 0) / items.length);
}

// ----- mco -----
const oracleThen = (A, B, p) => oracleMap(B, oracleMap(A, p));
const oracleCompose = (A, B) => [...new Set(oraclePoints(A.length).map(p => oracleThen(A, B, p).map(x => x.toFixed(3)).join()))].sort().join(';');
test('mco: exactly one option is the picture of "first A, then B"; order matters; counts, 3D from Deep 10 (300)', () => {
  const rng = makeRng(111);
  for (let i = 0; i < 300; i++) {
    const deep = i % 2 === 1, lvl = deep ? 6 + i % 10 : 1 + i % 10, item = DRILLS.mco[deep ? 'deep' : 'light'](lvl, rng), { A, B } = item;
    const want = oracleCompose(A, B), wrong = oracleCompose(B, A), pics = item.mats.map(oraclePicture), n = deep && lvl >= 10 ? 3 : 2;
    assert(item.options.length === (deep ? 4 : 2) && item.mats.length === item.options.length && A.length === n && B.length === n, 'shape ' + i);
    assert(want !== wrong && pics.includes(wrong), 'order matters ' + i);
    assert(pics.filter(q => q === want).length === 1 && pics[+item.answer] === want && new Set(pics).size === pics.length, 'exactly one ' + i);
    if (deep) assert(pics.includes(oraclePicture(A)) && pics.includes(oraclePicture(B)), 'A and B alone are options');
    item.mats.forEach(m => {
      const st = oracleStretches(m);
      assert(!isEye(m) && Math.min(...st) >= 0.5 - 0.02 && Math.max(...st) <= 3 * Math.min(...st) + 0.05 && m.flat().every(x => Math.abs(x) <= 2), 'well shaped ' + matKey(m));
    });
    if (n === 3) {
      const view = M => oraclePoints(3).map(p => applyPose(oracleMap(M, p), MAT_VIEW)), P = item.mats.map(view), f = item.fit;
      for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) assert(Math.max(...P[a].map((p, k) => Math.hypot(p[0] - P[b][k][0], p[1] - P[b][k][1]))) / f.span >= 0.08, 'too alike ' + i);
    }
  }
});
test('mco: commuting pairs, equal pictures and slivers are rejected', () => {
  const R = [[0, -1], [1, 0]], S = [[1, 0], [0, 2]], T = [[1, 1], [0, 1]];
  assert(mcoOptions(R, R, true) === null && mcoOptions(S, S, false) === null, 'commuting');
  assert(mcoOptions(R, [[0, 1], [-1, 0]], false) === null, 'inverse pair commutes');
  assert(mcoOptions(R, T, true).length === 4 && mcoOptions(R, T, false).length === 2, 'valid pair');
  assert(mcoOptions(S, T, true) === null, 'S·T is a sliver (ratio above 3)');
  assert(mcoOptions([[1, 1], [1, 1]], T, true) === null, 'singular A');
});
test('wellShaped agrees with sampled stretches on 300 matrices of both sizes', () => {

    const lo = Math.min(...st), hi = Math.max(...st), ok = lo >= 0.5 && hi <= 3 * lo;
    if (Math.abs(lo - 0.5) > 0.03 && Math.abs(hi - 3 * lo) > 0.1) assert(wellShaped(M) === ok, 'wellShaped ' + matKey(M) + ' ' + lo.toFixed(3) + ' ' + hi.toFixed(3));
  }
});

  const rng = makeRng(101);

    const [a, b] = [item.M[0][0] * x + item.M[0][1] * y, item.M[1][0] * x + item.M[1][1] * y];
    assert(item.answer === a + ',' + b && item.to.join() === a + ',' + b, 'answer = M·p');
    assert(Math.abs(a) <= item.range && Math.abs(b) <= item.range && item.range === (deep ? 6 : 3), 'image in grid');
    assert((a !== x || b !== y) && (x || y) && det(item.M) !== 0, 'image differs from the point');
    assert(Math.abs(x) <= (deep ? 3 : 2) && Math.abs(y) <= (deep ? 3 : 2), 'point range');
    assert(!(deep && lvl >= 8 && (x === 0 || y === 0)), 'off-axis at Deep ≥ 8');
    assert(item.options.length === (2 * item.range + 1) ** 2 && item.options.includes(item.answer), 'one option per lattice point');
  }
});
